<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070c1e" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#67e8f9" />
      <stop offset="80%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="chartGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="chartGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes flowWave {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -1200; }
      }
      @keyframes blinkNode {
        0%, 100% { opacity: 0.3; r: 3.5; }
        50% { opacity: 1; r: 6; }
      }
      .anim-pulse-cyan {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 200px 180px;
      }
      .anim-pulse-purple {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: 1000px 180px;
      }
      .anim-float-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .anim-float-2 {
        animation: floatReverse 6s ease-in-out infinite;
      }
      .anim-wave-1 {
        stroke-dasharray: 12, 6;
        animation: flowWave 25s linear infinite;
      }
      .anim-wave-2 {
        stroke-dasharray: 8, 4;
        animation: flowWave 18s linear infinite;
      }
      .anim-node-1 { animation: blinkNode 2.5s ease-in-out infinite; }
      .anim-node-2 { animation: blinkNode 3.2s ease-in-out infinite 0.7s; }
      .anim-node-3 { animation: blinkNode 2.8s ease-in-out infinite 1.4s; }
      .anim-node-4 { animation: blinkNode 3.5s ease-in-out infinite 2s; }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="180" cy="180" r="220" fill="url(#orbCyan)" class="anim-pulse-cyan" />
  <circle cx="1020" cy="180" r="240" fill="url(#orbPurple)" class="anim-pulse-purple" />
  <ellipse cx="600" cy="180" rx="420" ry="160" fill="url(#centerGlow)" />

  <!-- Background Analytics Dynamic Charts & Waveforms -->
  <!-- Layer 1: Filled Area Charts -->
  <path d="M 0 310 Q 180 230, 360 270 T 720 220 T 1040 260 T 1200 200 L 1200 360 L 0 360 Z" fill="url(#chartGradient2)" />
  <path d="M 0 325 Q 150 260, 320 295 T 680 250 T 980 285 T 1200 230 L 1200 360 L 0 360 Z" fill="url(#chartGradient1)" />

  <!-- Layer 2: Dynamic Animated Flow Lines -->
  <path d="M 0 310 Q 180 230, 360 270 T 720 220 T 1040 260 T 1200 200" fill="none" stroke="url(#lineGrad1)" stroke-width="2.5" class="anim-wave-1" filter="url(#glow)" />
  <path d="M 0 325 Q 150 260, 320 295 T 680 250 T 980 285 T 1200 230" fill="none" stroke="url(#lineGrad2)" stroke-width="2" class="anim-wave-2" />

  <!-- Floating Telemetry Chart Data Nodes -->
  <circle cx="180" cy="245" fill="#38bdf8" class="anim-node-1" filter="url(#glow)" />
  <circle cx="360" cy="270" fill="#818cf8" class="anim-node-2" filter="url(#glow)" />
  <circle cx="720" cy="220" fill="#38bdf8" class="anim-node-3" filter="url(#glow)" />
  <circle cx="1040" cy="260" fill="#ec4899" class="anim-node-4" filter="url(#glow)" />

  <!-- Background Floating Badges (Subtle, Behind Content) -->
  <g class="anim-float-1" opacity="0.6">
    <rect x="70" y="55" width="125" height="30" rx="15" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
    <text x="132" y="75" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ PostHog</text>
  </g>

  <g class="anim-float-2" opacity="0.6">
    <rect x="1005" y="55" width="135" height="30" rx="15" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="1072" y="75" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📈 Mixpanel</text>
  </g>

  <g class="anim-float-2" opacity="0.5">
    <rect x="50" y="275" width="130" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="115" y="294" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🛡️ Umami &amp; Matomo</text>
  </g>

  <g class="anim-float-1" opacity="0.5">
    <rect x="1010" y="275" width="140" height="28" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-width="1" />
    <text x="1080" y="294" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🏢 GA4 360 &amp; Adobe</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (High contrast, never obscured) -->
  <g filter="url(#dropShadow)">
    <!-- Category Pill Tag -->
    <g>
      <rect x="430" y="45" width="340" height="32" rx="16" fill="#0f172a" stroke="url(#lineGrad1)" stroke-width="1.6" />
      <circle cx="448" cy="61" r="5" fill="#10b981" class="anim-node-1" />
      <text x="605" y="66" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">
        ENTERPRISE &amp; OPEN-SOURCE TELEMETRY
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#titleGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.8" text-anchor="middle">
      AWESOME ENTERPRISE DIGITAL ANALYTICS
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0.2" text-anchor="middle">
      The Curated Architectural Index of Enterprise SaaS &amp; Self-Hosted Behavioral Data Platforms
    </text>

    <!-- Technology Highlights Bar -->
    <g transform="translate(600, 222)">
      <!-- Central Underline Accent -->
      <line x1="-240" y1="0" x2="240" y2="0" stroke="url(#lineGrad1)" stroke-width="1.5" stroke-opacity="0.5" />
    </g>

    <!-- Bottom Capability Pills -->
    <g transform="translate(230, 244)">
      <!-- Pill 1: Web & Product Analytics -->
      <rect x="0" y="0" width="168" height="28" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <text x="84" y="18" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">📊 Web &amp; Product</text>

      <!-- Pill 2: Privacy & Cookieless -->
      <rect x="180" y="0" width="180" height="28" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <text x="270" y="18" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🛡️ Cookieless &amp; GDPR</text>

      <!-- Pill 3: Event Streaming & CDPs -->
      <rect x="372" y="0" width="185" height="28" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <text x="464.5" y="18" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">⚡ Event Pipelines &amp; CDP</text>

      <!-- Pill 4: Session Replay & DXA -->
      <rect x="569" y="0" width="175" height="28" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <text x="656.5" y="18" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🔍 Session Replay &amp; DXA</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.7" />
</svg>
